name: Build Android APK (debug)

# 手机里编不出 APK：app/android 是 Flutter 宿主工程，而本机 Linux 是
# aarch64、Flutter 官方只发 x86-64 的 Linux SDK。于是把编译搬到云端跑。
#
# 用法：
#   gh workflow run android-apk.yml --ref ci/android-apk
#   gh run watch
#   gh run download <run-id> -n heracles-apk-debug -D build/apk
#
# 产物：app/build/app/outputs/flutter-apk/app-debug.apk

on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ubuntu-latest 镜像已预装 Android SDK；不装 setup-android 那一步
      # （2026-11-22 实测：它 accept licenses 时把 sdkmanager 弄挂了，job 直接崩）
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本按 README 的要求钉死：Flutter 3.47.7（Dart ^3.12.2）
      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Android SDK 许可 + compileSdk 37
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 37 已发布就直接装；没装上也别停 —— AGP 9 在许可接受后会自己下
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || true

      - name: flutter doctor（诊断用）
        run: flutter doctor -v || true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk --debug (arm64)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: heracles-apk-debug
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
